variables:
  BOARD: "CubeOrangePlus"
  FIRMWARE_NAME: "JetPilot"
  BUILD_IMAGE: "ardupilot/ardupilot-dev-chibios:latest"

stages:
  - build
  - deploy

build_and_sign:
  stage: build
  image: $BUILD_IMAGE


  before_script:
    - apt-get update -qq && apt-get install -y -qq python3-dev
    - python3 -m pip install pymonocypher==3.1.3.1 --quiet
    - |
      mkdir -p /tmp/signing
      printf '%s' "$SIGNING_FIRMWARE_PRIVATE_KEY_B64" | base64 -d > /tmp/signing/private_key.dat
      printf '%s' "$SIGNING_FIRMWARE_PUBLIC_KEY_B64"  | base64 -d > /tmp/signing/public_key.dat
      chmod 600 /tmp/signing/private_key.dat
    - |
      if [ -f ".gitmodules" ]; then
        git submodule update --init --recursive
      fi

  script:
    - ./waf distclean
    - ./waf configure --board "${BOARD}" --signed-fw --private-key /tmp/signing/private_key.dat
    - ./waf copter
    - |
      APJ="build/${BOARD}/bin/${FIRMWARE_NAME}.apj"
      [ -f "$APJ" ] || { echo "APJ not found"; ls build/${BOARD}/bin/; exit 1; }
      python3 -c "
      import json, sys
      with open('${APJ}') as f:
          d = json.load(f)
      if not d.get('signature'):
          print('No signature in APJ')
          sys.exit(1)
      "
    - mkdir -p staging
    - cp "build/${BOARD}/bin/${FIRMWARE_NAME}.apj" staging/

  after_script:
    - rm -rf /tmp/signing/

  artifacts:
    paths:
      - staging/${FIRMWARE_NAME}.apj
    expire_in: 30 days

  cache:
    key: "waf-${BOARD}"
    paths:
      - build/${BOARD}/


deploy_to_registry:
  stage: deploy
  image: alpine:3.19

  dependencies:
    - build_and_sign

  before_script:
    - apk add --no-cache curl python3

  script:
    - |
      PKG_NAME="arducopter-firmware"
      PKG_VERSION=$(echo "${CI_COMMIT_MESSAGE}" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
      if [ -z "${PKG_VERSION}" ]; then
        echo "No version found in commit message (expected format: v1.0.0)"
        exit 1
      fi
      # Export for subsequent shell blocks
      echo "PKG_VERSION=${PKG_VERSION}" >> build.env
      echo "PKG_NAME=${PKG_NAME}"       >> build.env
      
    - source build.env

    - |
      python3 << PYEOF
      import json, os, hashlib

      def sha256(path):
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(8192), b""):
                  h.update(chunk)
          return h.hexdigest()

      pkg_version = os.environ["PKG_VERSION"]
      fw_name     = os.environ["FIRMWARE_NAME"]
      project_url = os.environ["CI_PROJECT_URL"]
      board       = os.environ["BOARD"]
      branch      = os.environ["CI_COMMIT_REF_NAME"]
      apj_path    = f"staging/{fw_name}.apj"
      
      apj_url = (
        f"{project_url}/-/package_files/"
        f"?package_name=arducopter-firmware"
        f"&package_version={pkg_version}"
        f"&file_name={fw_name}.apj"
      )

      manifest = {
          "firmware_version": pkg_version,
          "vehicle_type":     "copter",
          "board":            board,
          "build_timestamp":  os.popen("date -u +%Y-%m-%dT%H:%M:%SZ").read().strip(),
          "files": {
              "apj": {
                  "url":        apj_url,
                  "sha256":     sha256(apj_path),
                  "size_bytes": os.path.getsize(apj_path),
              }
          }
      }

      with open("staging/version.json", "w") as f:
          json.dump(manifest, f, indent=2)
      PYEOF

    - |
      curl --fail --silent --show-error \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "staging/${FIRMWARE_NAME}.apj" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${PKG_VERSION}/${FIRMWARE_NAME}.apj"
    
    - |
     curl --fail --silent --show-error \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "staging/version.json" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${PKG_VERSION}/version.json"