variables:
  BOARD: "CubeOrangePlus"
  FIRMWARE_TYPE: "arducopter"
  FIRMWARE_NAME: "JetPilot"
  BUILD_IMAGE: "ardupilot/ardupilot-dev-chibios:latest"

stages:
  - build
  - deploy

build_and_sign:
  stage: build
  image: $BUILD_IMAGE


  before_script:
    - apt-get update -qq && apt-get install -y -qq python3-dev
    - python3 -m pip install pymonocypher==3.1.3.1 --quiet
    - |
      mkdir -p /tmp/signing
      printf '%s' "$SIGNING_FIRMWARE_PRIVATE_KEY_B64" | base64 -d > /tmp/signing/private_key.dat
      printf '%s' "$SIGNING_FIRMWARE_PUBLIC_KEY_B64"  | base64 -d > /tmp/signing/public_key.dat
      chmod 600 /tmp/signing/private_key.dat
    - cat /tmp/signing/private_key.dat
    - |
      if [ -f ".gitmodules" ]; then
        git submodule update --init --recursive
      fi

  script:
    - ./waf distclean
    - ./waf configure --board "${BOARD}" --signed-fw --private-key /tmp/signing/private_key.dat
    - ./waf copter
    - |
      APJ="build/${BOARD}/bin/${FIRMWARE_TYPE}.apj"
      [ -f "$APJ" ] || { echo "APJ not found"; ls build/${BOARD}/bin/; exit 1; }
      python3 -c "
      import json, sys
      with open('${APJ}') as f:
          d = json.load(f)
      is_signed = d.get('signed_firmware')
      print('signed_firmware:', is_signed)
      if not is_signed:
        print('signed_firmware flag not set in APJ')
        sys.exit(1)
      "
    - mkdir -p staging
    - cp "build/${BOARD}/bin/${FIRMWARE_TYPE}.apj" staging/

  after_script:
    - rm -rf /tmp/signing/

  artifacts:
    paths:
      - staging/${FIRMWARE_TYPE}.apj
    expire_in: 30 days

  cache:
    key: "waf-${BOARD}"
    paths:
      - build/${BOARD}/


deploy_to_registry:
  stage: deploy
  image: alpine:3.19

  dependencies:
    - build_and_sign

  before_script:
    - apk add --no-cache curl python3

  script:
    - |
      PKG_NAME="${FIRMWARE_NAME}-firmware"
      PKG_VERSION=$(echo "${CI_COMMIT_MESSAGE}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      if [ -z "${PKG_VERSION}" ]; then
        echo "No version found in commit message (expected format: v1.0.0)"
        exit 1
      fi
      python3 -c "
      import json, os, hashlib

      def sha256(path):
          h = hashlib.sha256()
          with open(path, 'rb') as f:
              for chunk in iter(lambda: f.read(8192), b''):
                  h.update(chunk)
          return h.hexdigest()

      pkg_version = '${PKG_VERSION}'
      pkg_name    = '${PKG_NAME}'
      fw_type     = '${FIRMWARE_TYPE}'
      fw_name     = '${FIRMWARE_NAME}'
      api_url     = '${CI_API_V4_URL}'
      apj_path    = 'staging/' + fw_type + '.apj'

      apj_url = api_url + '/projects/' + project_id + '/packages/generic/' + pkg_name + '/' + pkg_version + '/' + fw_type + '.apj'

      manifest = {
          'firmware_name':    fw_name,
          'firmware_version': pkg_version,
          'vehicle_type':     'copter',
          'build_timestamp':  __import__('subprocess').check_output(['date','-u','+%Y-%m-%dT%H:%M:%SZ']).decode().strip(),
          'files': {
              'apj': {
                  'url':        apj_url,
                  'sha256':     sha256(apj_path),
                  'size_bytes': os.path.getsize(apj_path),
              }
          }
      }

      with open('staging/version.json', 'w') as f:
          json.dump(manifest, f, indent=2)
      "
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "staging/${FIRMWARE_TYPE}.apj" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${PKG_VERSION}/${FIRMWARE_TYPE}.apj"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "staging/version.json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${PKG_VERSION}/version.json"